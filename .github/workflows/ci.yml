name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main, 'feature/*']

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Run ML training
        run: python -m ml.severity_classifier
        continue-on-error: true
      - name: Run Pytest
        run: pytest tests -v
        env:
          FLASK_ENV: testing
          TESTING: 'true'
          MONGO_URI: mongodb://localhost:27017/test_code_review
          JWT_SECRET: test-secret-key-12345
          GROQ_API_KEY: mock_test_key
          GITHUB_WEBHOOK_SECRET: ci-test-webhook-secret-12345

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
        env:
          CI: false
