name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python Backend (PyInstaller)
        run: |
          cd backend
          python -m venv venv
          .\venv\Scripts\activate
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --name backend app.py
          mkdir -p dist/backend_out
          mv dist/backend.exe dist/backend_out/

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Electron App
        run: |
          cd desktop
          npm install
          npm run dist

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntelliReview-AI-Setup
          path: dist\IntelliReview-AI-Setup.exe

      - name: Release Installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\IntelliReview-AI-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
