services:
  - type: web
    name: ai-code-review-api
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: cd backend && pip install -r requirements.txt && python train_model.py || true
    startCommand: cd backend && gunicorn --config gunicorn.conf.py app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CALLBACK_URL
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: OLLAMA_BASE_URL
        value: ""
      - key: OLLAMA_MODEL
        value: qwen2.5-coder:7b
      - key: LOG_LEVEL
        value: INFO
