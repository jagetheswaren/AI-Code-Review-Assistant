<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="16" fill="url(#bg)"/>

  <!-- Shield Icon -->
  <g transform="translate(30, 30)">
    <path d="M70 10 L130 35 L130 80 C130 120 100 145 70 155 C40 145 10 120 10 80 L10 35 Z" 
          fill="url(#shield)" opacity="0.15" stroke="url(#shield)" stroke-width="2.5"/>
    <!-- Checkmark inside shield -->
    <path d="M45 80 L65 100 L100 55" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Code brackets -->
    <text x="25" y="48" font-family="monospace" font-size="28" font-weight="bold" fill="#00d2ff" opacity="0.8">&lt;</text>
    <text x="98" y="48" font-family="monospace" font-size="28" font-weight="bold" fill="#7b2ff7" opacity="0.8">/&gt;</text>
  </g>

  <!-- Text: AI -->
  <text x="190" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="60" font-weight="800" fill="url(#accent)" letter-spacing="-1">AI</text>

  <!-- Text: Code Review -->
  <text x="280" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="60" font-weight="300" fill="#e0e0e0" letter-spacing="-1">Code Review</text>

  <!-- Text: ASSISTANT -->
  <text x="190" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#8892b0" letter-spacing="8">ASSISTANT</text>

  <!-- Decorative dots -->
  <circle cx="530" cy="40" r="4" fill="#00d2ff" opacity="0.6"/>
  <circle cx="550" cy="60" r="3" fill="#7b2ff7" opacity="0.5"/>
  <circle cx="540" cy="80" r="5" fill="#00d2ff" opacity="0.4"/>
  <circle cx="560" cy="100" r="3" fill="#7b2ff7" opacity="0.6"/>
  <circle cx="545" cy="130" r="4" fill="#00d2ff" opacity="0.3"/>
  <circle cx="555" cy="155" r="3" fill="#7b2ff7" opacity="0.5"/>

  <!-- Subtitle line -->
  <line x1="190" y1="145" x2="520" y2="145" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>

  <!-- Bottom tagline -->
  <text x="190" y="170" font-family="monospace" font-size="14" fill="#5a6a8a">Security | Smells | Complexity | AI Explanations</text>
</svg>
